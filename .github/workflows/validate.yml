name: Validate lessons

# Kein paths-Filter am pull_request-Trigger: validate ist Required-Check der
# Branch-Protection — mit Filter bleibt jeder PR ausserhalb der Pfade (z.B.
# LICENSE/README) dauerhaft BLOCKED, weil der Check nie startet (2026-08-26,
# PR #373). Der Lauf ist billig; er validiert ohnehin das ganze lessons/.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install validator dependencies
        run: npm install --no-audit --no-fund

      - name: Validate lesson frontmatter + injection scan
        run: node scripts/validate.mjs
